<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 660" width="900" height="660" font-family="ui-sans-serif, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <rect width="900" height="660" fill="#ffffff"/>

  <text x="32" y="40" font-size="20" font-weight="700" fill="#14161a">Request flow: creating a contact</text>
  <text x="32" y="62" font-size="13" fill="#5c6470">Ownership is enforced by Postgres, not by application code.</text>

  <!-- Browser -->
  <rect x="32" y="86" width="836" height="96" rx="10" fill="#f4f7ff" stroke="#c7d7f5"/>
  <text x="50" y="110" font-size="13" font-weight="700" fill="#1c4fd8">BROWSER</text>
  <text x="130" y="110" font-size="12" fill="#5c6470">React client &#183; served by Vercel</text>
  <text x="50" y="134" font-size="12" fill="#14161a">ContactForm collects the fields, then asks Neon Auth for a JWT:</text>
  <text x="50" y="156" font-size="12" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" fill="#1c4fd8">GET &lt;neon-auth&gt;/token</text>
  <text x="240" y="156" font-size="12" fill="#5c6470">&#8594; JWT whose <tspan font-family="ui-monospace, SFMono-Regular, Menlo, monospace">sub</tspan> claim is this user's id</text>
  <text x="50" y="174" font-size="11" fill="#8a919c">src/lib/neon-browser.ts</text>

  <path d="M450 182 L450 214" stroke="#9aa3b0" stroke-width="1.5" marker-end="url(#a)"/>
  <text x="462" y="203" font-size="11" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" fill="#5c6470">POST /api/contacts + Authorization: Bearer &lt;JWT&gt;</text>

  <!-- Backend -->
  <rect x="32" y="218" width="836" height="150" rx="10" fill="#f3fbf5" stroke="#bfe3c9"/>
  <text x="50" y="242" font-size="13" font-weight="700" fill="#1a7f3c">BACKEND</text>
  <text x="130" y="242" font-size="12" fill="#5c6470">Next.js route handlers &#183; also on Vercel</text>
  <text x="50" y="266" font-size="12" fill="#14161a">1. No Bearer token &#8594; <tspan font-weight="600">401</tspan>, before any database work</text>
  <text x="50" y="286" font-size="12" fill="#14161a">2. Zod validates the body &#8594; <tspan font-weight="600">400</tspan> with per-field messages</text>
  <text x="50" y="306" font-size="12" fill="#14161a">3. <tspan font-family="ui-monospace, SFMono-Regular, Menlo, monospace">strictObject()</tspan> rejects any <tspan font-family="ui-monospace, SFMono-Regular, Menlo, monospace">user_id</tspan> the client tried to send</text>
  <text x="50" y="326" font-size="12" fill="#14161a">4. Forwards <tspan font-weight="600">the caller's own JWT</tspan> onward &#8212; never <tspan font-family="ui-monospace, SFMono-Regular, Menlo, monospace">DATABASE_URL</tspan></text>
  <text x="50" y="352" font-size="11" fill="#8a919c">src/app/api/contacts/route.ts &#183; src/lib/neon-server.ts</text>

  <rect x="560" y="258" width="292" height="86" rx="8" fill="#ffffff" stroke="#bfe3c9"/>
  <text x="574" y="278" font-size="11" font-weight="700" fill="#1a7f3c">WHY FORWARD THE USER'S JWT?</text>
  <text x="574" y="298" font-size="11" fill="#14161a">Connecting as the database owner would</text>
  <text x="574" y="314" font-size="11" fill="#14161a">bypass RLS entirely, making every policy</text>
  <text x="574" y="330" font-size="11" fill="#14161a">below decorative.</text>

  <path d="M450 368 L450 400" stroke="#9aa3b0" stroke-width="1.5" marker-end="url(#a)"/>
  <text x="462" y="389" font-size="11" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" fill="#5c6470">INSERT via Neon Data API, same JWT attached</text>

  <!-- Database -->
  <rect x="32" y="404" width="836" height="168" rx="10" fill="#fdf6f0" stroke="#f0d5bd"/>
  <text x="50" y="428" font-size="13" font-weight="700" fill="#b45f13">NEON POSTGRES</text>
  <text x="190" y="428" font-size="12" fill="#5c6470">the trusted layer &#183; db/schema.sql</text>

  <text x="50" y="454" font-size="12" fill="#14161a"><tspan font-family="ui-monospace, SFMono-Regular, Menlo, monospace">user_id text NOT NULL DEFAULT auth.user_id()</tspan></text>
  <text x="50" y="472" font-size="11" fill="#5c6470">Reads <tspan font-family="ui-monospace, SFMono-Regular, Menlo, monospace">sub</tspan> from the JWT and stamps the true owner. Clients never send user_id at all.</text>

  <text x="50" y="500" font-size="12" fill="#14161a"><tspan font-family="ui-monospace, SFMono-Regular, Menlo, monospace">CHECK</tspan> constraints &#8212; non-blank name, priority in (high, medium, low)</text>
  <text x="50" y="518" font-size="11" fill="#5c6470">The Data API URL is public, so these hold even when a caller skips the backend entirely.</text>

  <text x="50" y="546" font-size="12" fill="#14161a">RLS <tspan font-weight="600">ENABLED</tspan> and <tspan font-weight="600">FORCED</tspan> &#8212; separate policies for select / insert / update / delete</text>
  <text x="50" y="564" font-size="11" fill="#5c6470">Update carries <tspan font-family="ui-monospace, SFMono-Regular, Menlo, monospace">WITH CHECK</tspan> as well as <tspan font-family="ui-monospace, SFMono-Regular, Menlo, monospace">USING</tspan>, so a row cannot be reassigned to another user.</text>

  <!-- Attack path -->
  <rect x="32" y="592" width="836" height="48" rx="10" fill="#fef2f2" stroke="#f5c9c9"/>
  <text x="50" y="614" font-size="12" font-weight="700" fill="#b91c1c">The two-account test attacks this arrow directly &#8594;</text>
  <text x="392" y="614" font-size="12" fill="#14161a">bypassing the backend, calling the public Data API as User B.</text>
  <text x="50" y="631" font-size="11" fill="#5c6470">A test driven through the app's own UI could not tell you whether Postgres or careful application code was doing the work.</text>

  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#9aa3b0"/>
    </marker>
  </defs>
</svg>
